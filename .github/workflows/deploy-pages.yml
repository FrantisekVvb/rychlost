name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          clean: true
          exclude_assets: '.github'

      - name: Enable GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          repo="${{ github.repository }}"
          api="https://api.github.com/repos/${repo}/pages"
          payload='{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}'

          code=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" \
            -d "${payload}")

          if [ "${code}" = "409" ] || [ "${code}" = "422" ]; then
            code=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}" \
              -d "${payload}")
          fi

          cat /tmp/pages-response.json
          if [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]; then
            echo "GitHub Pages enabled."
          else
            echo "Pages already configured or cannot be changed from workflow (HTTP ${code})."
          fi
